[project]
name = 'zharf'
version = '0.1.0'
description = 'The Python library for the Zharf platform (platform.zharf.ai).'
authors = [
    { name = 'ZharfAI' },
]
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.9'
dependencies = [
    'httpx>=0.27',
]
keywords = ['zharf', 'llm', 'ai', 'api', 'chat', 'embeddings', 'openai-compatible', 'persian']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Natural Language :: Persian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Typing :: Typed',
]

[project.optional-dependencies]
dev = [
    'pytest>=7',
]

[project.urls]
Homepage = 'https://platform.zharf.ai'
Repository = 'https://github.com/ZharfAI/zharf-python'
Issues = 'https://github.com/ZharfAI/zharf-python/issues'

[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['zharf']

[tool.hatch.build.targets.sdist]
include = [
    'zharf',
    'tests',
    'examples',
    'README.md',
    'SECURITY.md',
    'LICENSE',
]

[tool.pytest.ini_options]
testpaths = ['zharf', 'tests']
addopts = ['--doctest-modules']

[tool.ruff]
line-length = 160
indent-width = 2

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['F', 'E', 'W', 'I', 'B', 'C4', 'SIM', 'RUF']
ignore = [
    'RUF001', # Persian text in strings is intended
    'RUF012', # each response type sets its own `_nested` map
]
